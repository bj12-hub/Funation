<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>커스텀 오버레이</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <script>
      // 커스텀 오버레이 sandbox (code-first). This page only ever runs in a frame with sandbox="allow-scripts" and no
      // same-origin, so it has an opaque origin: no cookies, no storage of the site, no access to the page around it.
      // Its response headers (next.config.ts) add a CSP with no network (connect-src 'none'). The page around it sends
      // the creator's code once ("ssumnation:code"), then live data ("ssumnation:data"), which reaches window.onData.
      (function () {
        var loaded = false;
        var queue = [];
        function deliver(type, data) {
          var fn = window.onData;
          if (typeof fn !== "function") return;
          try {
            fn(type, data);
          } catch (err) {
            console.error(err);
          }
        }
        window.addEventListener("message", function (e) {
          if (e.source !== window.parent) return;
          var m = e.data;
          if (!m || typeof m !== "object") return;
          if (m.type === "ssumnation:code" && !loaded) {
            loaded = true;
            var style = document.createElement("style");
            style.textContent = String(m.css || "");
            document.head.appendChild(style);
            var root = document.createElement("div");
            root.id = "overlay";
            root.innerHTML = String(m.html || "");
            document.body.appendChild(root);
            var script = document.createElement("script");
            script.textContent = String(m.js || "");
            document.body.appendChild(script);
            queue.splice(0).forEach(function (q) {
              deliver(q[0], q[1]);
            });
          } else if (m.type === "ssumnation:data" && typeof m.event === "string") {
            if (loaded) deliver(m.event, m.data);
            else queue.push([m.event, m.data]);
          }
        });
        window.parent.postMessage({ type: "ssumnation:ready" }, "*");
      })();
    </script>
  </body>
</html>
